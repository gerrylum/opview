name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      # the screenshot (golden) comparisons are skipped, as in the other builds: they are
      # rendered against stored images that the layout changes in this fork do not match
      - run: flutter test --exclude-tags golden

      # the permanent release key from the repository secrets, so every APK can install over the last one.
      # Without the secrets (a fork, say) the APK is signed with a throwaway debug key
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPVIEW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPVIEW_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no OPVIEW_KEYSTORE_BASE64 secret: signing with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/opview-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/opview-release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/key.properties

      # Android only installs an update with a higher build number: the commit count only goes up
      - name: Build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name "$version" --build-number "$BUILD_NUMBER" \
            --dart-define=OPVIEW_BUILD="$version"

      # which key signed the APK. keytool cannot read it (the APK has only the v2/v3 signature
      # scheme, no JAR signature), so use the SDK's apksigner; informational, never fails the build
      - name: Signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | grep -E "certificate (DN|SHA-256 digest)" || echo "::warning::could not read the signing certificate"

      - name: Rename APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "OPRivView-${version}.apk"

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          # an annotated tag's message is the release notes (the app shows its first four "- " lines);
          # otherwise the commit subjects since the last tag
          notes=""
          # the checkout can leave the tag as a plain pointer to the commit: fetch the tag itself
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          fi
          if [ -n "$notes" ]; then
            log="$notes"
          elif [ -n "$prev_tag" ]; then
            log=$(git log --pretty=format:'- %s' "${prev_tag}..${GITHUB_REF_NAME}^")
          else
            log="- Initial release"
          fi
          {
            echo 'body<<EOF'
            echo "$log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.body }}

            ## Download

            - **OPRivView APK** — Universal Android APK (sideload)
          files: OPRivView-*.apk
